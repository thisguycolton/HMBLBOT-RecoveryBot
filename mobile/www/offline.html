<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RecoveryBot</title>
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px;
      padding-top: max(24px, env(safe-area-inset-top)); padding-bottom: max(24px, env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f4; color: #0f172a; text-align: center; box-sizing: border-box;
    }
    @media (prefers-color-scheme: dark) { body { background: #292524; color: #f5f5f5; } p { color: #a3a3a3 !important; } }
    .card { max-width: 340px; }
    svg { width: 72px; height: 72px; color: #4c7ba6; }
    h1 { font-size: 22px; margin: 16px 0 8px; }
    p { margin: 0 0 24px; line-height: 1.5; color: #475569; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 12px 28px;
      background: #4c7ba6; color: #fff;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.43"/><path d="M2 8.82a15 15 0 0 1 4.18-2.65"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/>
    </svg>
    <h1 id="title">Can't reach RecoveryBot</h1>
    <p id="text">Check your connection, then try again. Nothing you saved is lost.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <script>
    // Back to the site's home; the app's settings hold the address (server.url)
    var home = "https://recoverybot.hmblbot.com/";
    try { if (window.Capacitor && window.Capacitor.getServerUrl) home = window.Capacitor.getServerUrl() || home; } catch (e) {}
    var params = new URLSearchParams(window.location.search);
    // The page they were opening, when it's on the site
    var from = params.get("from");
    var back = from && from.indexOf(home.replace(/\/$/, "")) === 0 ? from : home;
    var retry = function () { window.location.href = back; };
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
    // The server answered with an error (ServerErrorGuard / AppWebViewClient), usually a
    // deploy restarting it: say so, and try again by itself every few seconds
    if (params.get("reason") === "server") {
      document.getElementById("title").textContent = "RecoveryBot is updating";
      document.getElementById("text").textContent = "This usually takes a minute or two. We'll open it again by ourselves as soon as it's back.";
      document.querySelector("svg").innerHTML = '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>';
      setTimeout(retry, 6000);
    }
    // The launch screen waits for the site; there isn't one, so don't keep it up
    try { window.Capacitor.Plugins.SplashScreen.hide(); } catch (e) {}
  </script>
</body>
</html>
