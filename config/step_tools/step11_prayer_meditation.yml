key: step11-morning-evening
step: 11
name: "Morning and evening"
summary: "The morning planning and evening review the Big Book describes on pages 86 to 88, with room for prayer and meditation, a week at a time."
default: true
intro: >
  "On awakening let us think about the twenty-four hours ahead." The Big Book offers a simple practice: plan the day
  in the morning and ask for direction, pause when agitated or doubtful during the day, and review it at night (your
  10th step). This keeps a week of mornings.
