  - beaner
  # anti-Asian
  - chink
  - gook
  - zipperhead
  - slant eye
  - slanty eye
  - chinaman
  - ching chong
  - jap
  # anti-South Asian / Middle Eastern
  - paki
  - towelhead
  - towel head
  - raghead
  - rag head
